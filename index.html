<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho principal com título e subtítulo -->
  <header class="header">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">Estudante Exemplo — 8º Ano (Turma 8C - Nº 25)</p>
  </header>

  <main class="container">
    
    <!-- Tela de Acesso (PIN) -->
    <section id="secao-login" class="card-login">
      <h2>Acesso ao Boletim</h2>
      <p class="login-info">Turma: <strong>8C</strong> | Número: <strong>25</strong></p>
      <div class="login-form">
        <label for="pin-input">Digite seu PIN:</label>
        <input type="password" id="pin-input" placeholder="PIN" maxlength="10">
        <button id="btn-entrar" onclick="fazerLogin()">Entrar</button>
      </div>
      <p id="mensagem-login" class="mensagem-status"></p>
    </section>

    <!-- Área Principal do Boletim (Oculta até o login) -->
    <div id="area-boletim" style="display: none;">
      
      <!-- Painel de Ações do Aluno -->
      <div class="painel-acoes">
        <button id="btn-alternar-edicao" onclick="alternarModoEdicao()">Alterar dados</button>
        <button id="btn-salvar" onclick="salvarAlteracoes()" style="display: none;">Salvar alterações</button>
        <span id="mensagem-salvar" class="mensagem-status"></span>
      </div>

      <!-- Área superior com os cards de resumo -->
      <section class="cards-grid">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="media-geral" class="card-valor">—</p>
        </div>

        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="total-faltas" class="card-valor">—</p>
        </div>

        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="bom-desempenho" class="card-valor">—</p>
        </div>

        <div class="card">
          <h3>Precisam de Atenção</h3>
          <p id="precisa-atencao" class="card-valor">—</p>
        </div>

        <div class="card">
          <h3>Frequência</h3>
          <p id="frequencia" class="card-valor">92%</p>
          <span class="card-status">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela responsiva com as disciplinas -->
      <section class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas (T1 / T2 / T3)</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <!-- Os dados serão inseridos dinamicamente -->
          </tbody>
        </table>
      </section>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
