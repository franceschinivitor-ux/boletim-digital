<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho principal com título e subtítulo -->
  <header class="header">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">Estudante Exemplo — 8º Ano</p>
  </header>

  <main class="container">
    
    <!-- Área superior com os cards de resumo -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="bom-desempenho" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="precisa-atencao" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia" class="card-valor">92%</p>
        <span class="card-status">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela responsiva com as disciplinas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- Os dados das 15 disciplinas serão inseridos automaticamente pelo JavaScript -->
        </tbody>
      </table>
    </section>

  </main>

  <!-- Script em JavaScript importado no final para carregar os dados -->
  <script src="script.js"></script>
</body>
</html>
